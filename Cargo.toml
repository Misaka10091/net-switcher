[package]
name = "net-switcher"
version = "0.1.0"
edition = "2024"
description = "Lightweight Windows system tray & GPUI utility for switching between DHCP and static gateway network modes"

[dependencies]
gpui = { version = "0.2.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
