name: Build & Release (Windows)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Locate Windows SDK fxc.exe for GPUI shader compilation
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $fxc) {
            throw "fxc.exe not found in Windows Kits"
          }
          Write-Host "Found fxc.exe at: $fxc"
          "GPUI_FXC_PATH=$fxc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run unit tests
        run: cargo test --locked --verbose

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\net-switcher.exe dist\net-switcher.exe
          Copy-Item config.example.json dist\config.json
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\* -DestinationPath net-switcher-windows-x86_64.zip -Force
          $hash = (Get-FileHash dist\net-switcher.exe -Algorithm SHA256).Hash
          "SHA256 (net-switcher.exe) = $hash" | Tee-Object -FilePath dist\SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: net-switcher-windows-x86_64
          path: |
            dist/net-switcher.exe
            dist/SHA256SUMS.txt
            net-switcher-windows-x86_64.zip
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/net-switcher.exe
            dist/SHA256SUMS.txt
            net-switcher-windows-x86_64.zip
